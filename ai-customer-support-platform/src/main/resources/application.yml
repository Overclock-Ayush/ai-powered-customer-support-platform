spring:
  application:
    name: ai-customer-support-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/supportdb}
    username: ${DB_USERNAME:support}
    password: ${DB_PASSWORD:support}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: always
  jackson:
    default-property-inclusion: non_null
  lifecycle:
    timeout-per-shutdown-phase: 15s

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-to-a-long-random-value-please}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  demo-data:
    enabled: ${DEMO_DATA_ENABLED:true}
  openai:
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    api-key: ${OPENAI_API_KEY:}
    chat-model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
    embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    embedding-dimensions: ${OPENAI_EMBEDDING_DIMENSIONS:1536}
    top-k: ${OPENAI_TOP_K:4}
    timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:60}
