server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:support;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  sql:
    init:
      mode: always
      schema-locations: ${SPRING_SQL_INIT_SCHEMA_LOCATIONS:classpath:schema-h2.sql}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
app:
  jwt-secret: ${SESSION_SECRET:change-this-development-secret-change-this-development-secret}
  jwt-expiration-ms: ${JWT_EXPIRATION_MS:86400000}
gemini:
  api-key: ${GEMINI_API_KEY:}
  chat-model: ${GEMINI_CHAT_MODEL:gemini-3.6-flash}
  embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
  base-url: https://generativelanguage.googleapis.com/v1beta