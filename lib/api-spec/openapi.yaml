openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API for the AI Customer Support Platform
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: tickets
  - name: knowledge
  - name: dashboard
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a customer account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get ticket metrics for the signed-in user
      responses:
        "200":
          description: Dashboard metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /tickets:
    get:
      operationId: listTickets
      tags: [tickets]
      summary: List tickets visible to the signed-in user
      parameters:
        - $ref: "#/components/parameters/StatusQuery"
        - $ref: "#/components/parameters/PriorityQuery"
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ticket"
    post:
      operationId: createTicket
      tags: [tickets]
      summary: Create a support ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketInput"
      responses:
        "201":
          description: Created ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
  /tickets/{id}:
    get:
      operationId: getTicket
      tags: [tickets]
      summary: Get a ticket
      parameters:
        - $ref: "#/components/parameters/TicketId"
      responses:
        "200":
          description: Ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateTicket
      tags: [tickets]
      summary: Update ticket details
      parameters:
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketUpdate"
      responses:
        "200":
          description: Updated ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
  /tickets/{id}/status:
    patch:
      operationId: updateTicketStatus
      tags: [tickets]
      summary: Update ticket status
      parameters:
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusUpdate"
      responses:
        "200":
          description: Updated ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
  /tickets/{id}/ai/analyze:
    post:
      operationId: analyzeTicket
      tags: [tickets]
      summary: Analyze a ticket with Gemini
      parameters:
        - $ref: "#/components/parameters/TicketId"
      responses:
        "200":
          description: Analyzed ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
  /tickets/{id}/ai/reply:
    post:
      operationId: generateTicketReply
      tags: [tickets]
      summary: Generate a grounded reply with retrieval augmented generation
      parameters:
        - $ref: "#/components/parameters/TicketId"
      responses:
        "200":
          description: Grounded reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RagReply"
  /knowledge:
    get:
      operationId: listKnowledge
      tags: [knowledge]
      summary: List knowledge base documents
      parameters:
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Knowledge documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeDocument"
    post:
      operationId: createKnowledge
      tags: [knowledge]
      summary: Create a knowledge base document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeInput"
      responses:
        "201":
          description: Created document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocument"
  /knowledge/{id}:
    get:
      operationId: getKnowledge
      tags: [knowledge]
      summary: Get a knowledge base document
      parameters:
        - $ref: "#/components/parameters/KnowledgeId"
      responses:
        "200":
          description: Knowledge document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocument"
  /knowledge/reindex:
    post:
      operationId: reindexKnowledge
      tags: [knowledge]
      summary: Rebuild Gemini embeddings for knowledge documents
      responses:
        "200":
          description: Reindex result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReindexResult"
components:
  parameters:
    TicketId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    KnowledgeId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    StatusQuery:
      name: status
      in: query
      schema:
        $ref: "#/components/schemas/TicketStatus"
    PriorityQuery:
      name: priority
      in: query
      schema:
        $ref: "#/components/schemas/TicketPriority"
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    User:
      type: object
      required: [id, name, email, role]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        email: { type: string, format: email }
        role:
          $ref: "#/components/schemas/UserRole"
    UserRole:
      type: string
      enum: [CUSTOMER, AGENT, ADMIN]
    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token: { type: string }
        user: { $ref: "#/components/schemas/User" }
    RegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 2 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }
    TicketCategory:
      type: string
      enum: [BILLING, TECHNICAL, ACCOUNT, SHIPPING, REFUND, GENERAL]
    TicketPriority:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]
    TicketStatus:
      type: string
      enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED]
    TicketSentiment:
      type: string
      enum: [POSITIVE, NEUTRAL, NEGATIVE, URGENT]
    Ticket:
      type: object
      required: [id, subject, description, category, priority, status, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        customer: { $ref: "#/components/schemas/User" }
        subject: { type: string }
        description: { type: string }
        category: { $ref: "#/components/schemas/TicketCategory" }
        priority: { $ref: "#/components/schemas/TicketPriority" }
        status: { $ref: "#/components/schemas/TicketStatus" }
        sentiment:
          anyOf:
            - { $ref: "#/components/schemas/TicketSentiment" }
            - { type: "null" }
        aiSummary: { type: ["string", "null"] }
        aiAnalyzedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TicketInput:
      type: object
      required: [subject, description]
      properties:
        subject: { type: string, minLength: 3 }
        description: { type: string, minLength: 10 }
        category: { $ref: "#/components/schemas/TicketCategory" }
        priority: { $ref: "#/components/schemas/TicketPriority" }
    TicketUpdate:
      type: object
      properties:
        subject: { type: string, minLength: 3 }
        description: { type: string, minLength: 10 }
        category: { $ref: "#/components/schemas/TicketCategory" }
        priority: { $ref: "#/components/schemas/TicketPriority" }
    StatusUpdate:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/TicketStatus" }
    KnowledgeDocument:
      type: object
      required: [id, title, content, category, hasEmbedding, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        content: { type: string }
        category: { $ref: "#/components/schemas/TicketCategory" }
        hasEmbedding: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    KnowledgeInput:
      type: object
      required: [title, content, category]
      properties:
        title: { type: string, minLength: 3 }
        content: { type: string, minLength: 20 }
        category: { $ref: "#/components/schemas/TicketCategory" }
    RagSource:
      type: object
      required: [documentId, title, similarity]
      properties:
        documentId: { type: integer, format: int64 }
        title: { type: string }
        similarity: { type: number, format: float }
    RagReply:
      type: object
      required: [answer, sources]
      properties:
        answer: { type: string }
        sources:
          type: array
          items: { $ref: "#/components/schemas/RagSource" }
    DashboardSummary:
      type: object
      required: [total, open, inProgress, resolved, critical, recent]
      properties:
        total: { type: integer }
        open: { type: integer }
        inProgress: { type: integer }
        resolved: { type: integer }
        critical: { type: integer }
        recent:
          type: array
          items: { $ref: "#/components/schemas/Ticket" }
    ReindexResult:
      type: object
      required: [processed, succeeded]
      properties:
        processed: { type: integer }
        succeeded: { type: integer }